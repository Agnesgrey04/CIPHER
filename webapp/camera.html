
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f3eb">

    <title>CIPHER | Camera Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/camera.css">
</head>

<body>
    <div id="cameraApp" v-cloak>
        

        <div class="dashboard">
          <main class="main-content">
            <section class="camera-layout">
              <div class="monitor-panel">
                <div class="monitor-header">
                  <div class="camera-title">
                    <span class="camera-symbol">▣</span>
                    <div>
                      <h2>CIPHER CAM-01</h2>
                      <p>Main Camera Feed</p>
                    </div>
                  </div>
                  <div class="monitor-header-right">
                    <span class="live-label">
                      <span
                      class="status-dot"
                      :class="{ 'status-dot-offline': connectionState !== 'connected' }"
                      ></span>
                      {{ connectionState === 'connected' ? 'LIVE' : 'DISCONNECTED' }}
                    </span>
                  </div>
                </div>
                <div class="monitor-screen">
                  <img
                  v-if="hasFrame"
                  :src="frameUrl"
                  class="live-image"
                  alt="CIPHER Live Camera Feed"
                  >
                  <div v-if="!hasFrame" class="feed-placeholder">
                    <div class="placeholder-icon">▣</div>
                    <h3>CONNECTING TO CAMERA</h3>
                    <p>{{ statusMessage }}</p>
                  </div>
                </div>
              </div>
            </section>
          </main>
                    

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <script src="js/camera.js"></script>
</body>
</html>
